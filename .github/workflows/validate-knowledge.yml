name: Validate Atlas Knowledge

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-knowledge:
    name: Validate entities and relationships
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current Atlas Knowledge
        uses: actions/checkout@v6
        with:
          path: atlas-knowledge

      - name: Checkout reference Atlas Core
        uses: actions/checkout@v6
        with:
          repository: atlasfitoterapiaorg/atlas-core
          ref: develop
          path: atlas-core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Validate entities and relationships
        run: python atlas-core/tools/validate_entities.py atlas-knowledge
